name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  examples:
    strategy:
      fail-fast: false
      matrix:
        example: [vanilla, nextjs, sveltekit, nuxt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # Each example depends on @klappay/one via "file:../.." (see
      # examples/README.md) — always the local build, never npm — so it
      # has to exist before `pnpm install` inside the example.
      - name: Install root dependencies and build @klappay/one
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # No lockfile is committed under examples/* on purpose — the
      # "file:../.." dependency's content changes on every local build
      # with no version bump, so a committed lockfile's integrity hash
      # would go stale immediately.
      - name: Install example dependencies
        working-directory: examples/${{ matrix.example }}
        run: pnpm install

      - name: Typecheck
        working-directory: examples/${{ matrix.example }}
        run: pnpm run --if-present typecheck

      - name: Test
        working-directory: examples/${{ matrix.example }}
        run: pnpm run --if-present test

      - name: Build
        working-directory: examples/${{ matrix.example }}
        run: pnpm run --if-present build

  examples-published-smoke-test:
    # Non-blocking: verifies @klappay/one@latest on npm still satisfies
    # each example, independent of what's on main. Expected to fail
    # between merging a feature and merging its "Version Packages" PR —
    # that's not a bug in the example, just latest not having shipped yet.
    strategy:
      fail-fast: false
      matrix:
        example: [vanilla, nextjs, sveltekit, nuxt]
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Point at the published latest instead of the local build
        run: pnpm pkg set dependencies.@klappay/one=latest

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Test
        run: pnpm run --if-present test

      - name: Build
        run: pnpm run --if-present build

  changeset-check:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify a changeset exists for any changed package
        run: pnpm exec changeset status --since=origin/main
